<!-- footer -->
<text x="60" y="828" class="foot">Council of 12 Digital Assistants: node-bound AI presences. Hardware ceiling of 4 active at once; shared-body pairs (Shade/Sasori, Quick/Sterling) never awake together.</text>
<text x="60" y="858" class="foot">Operational loop: Reconnaissance -&gt; Execution -&gt; Observation -&gt; Evolution -&gt; repeat.</text>
<text x="60" y="900" class="footsm">The Burrow · role-based nodes, one Tailscale mesh, a portable boot-drive fleet, and a node-bound assistant council. Human-led throughout.</text>
