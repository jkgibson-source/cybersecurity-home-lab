<!-- footer -->
<text x="60" y="1120" class="foot">The Order: 15 node-bound Digital Assistants across 13 bodies. Hardware ceiling of 7 active at once; shared-body pairs (Shade/Sasori, Quick/Sterling) never awake together.</text>
<text x="60" y="1150" class="foot">Operational loop: Reconnaissance -&gt; Execution -&gt; Observation -&gt; Evolution -&gt; repeat.</text>
<text x="60" y="1192" class="footsm">The Burrow · role-based core nodes, one Tailscale mesh, a portable Djinngle boot-drive fleet, Fringe edge nodes, and a node-bound assistant council. Human-led throughout.</text>
